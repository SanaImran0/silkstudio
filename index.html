<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silk Studio</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1a1a1a;
      --muted: #5c5c5c;
      --line: #e4e4e4;
      --paper: #f7f6f4;
      --white: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.45;
    }
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 560;
      letter-spacing: -0.03em;
    }
    .lede {
      margin: 0 0 28px;
      color: var(--muted);
    }
    .count {
      margin: 0 0 8px;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    section {
      padding: 16px 0;
      border-top: 1px solid var(--line);
    }
    section h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 560;
    }
    .hint {
      margin: 4px 0 12px;
      color: var(--muted);
      font-size: 14px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
    }
    label.choose {
      display: inline-block;
      padding: 7px 12px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: var(--white);
      cursor: pointer;
      font-size: 14px;
    }
    label.choose input { display: none; }
    label.skip {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      color: var(--muted);
      font-size: 14px;
    }
    .previews {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }
    figure {
      margin: 0;
      width: 96px;
    }
    figure img {
      width: 96px;
      height: 96px;
      object-fit: cover;
      border-radius: 6px;
      background: var(--white);
      border: 1px solid var(--line);
    }
    figcaption {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
      word-break: break-word;
    }
    figcaption button {
      display: block;
      margin-top: 2px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      text-decoration: underline;
    }
    .actions {
      margin-top: 24px;
    }
    button.generate {
      padding: 12px 18px;
      border: 0;
      border-radius: 999px;
      background: var(--ink);
      color: var(--white);
      font: inherit;
      font-size: 15px;
      cursor: pointer;
    }
    button.generate:disabled {
      opacity: 0.45;
      cursor: default;
    }
    #status {
      min-height: 1.4em;
      margin: 0 0 12px;
      color: var(--muted);
    }
    #result {
      margin-top: 28px;
    }
    #result img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      background: var(--white);
    }
    #result a {
      color: var(--ink);
    }
    pre {
      white-space: pre-wrap;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Silk Studio</h1>
    <p class="lede">Add each piece of one outfit. The portrait appears on this page.</p>
    <p class="count" id="count">0 of 14 photos</p>
    <div id="slots"></div>
    <div class="actions">
      <p id="status" role="status"></p>
      <button class="generate" id="generate" type="button">Generate portrait</button>
    </div>
    <div id="result" hidden>
      <img id="portrait" alt="Generated fashion portrait">
      <p><a id="download" href="" download>Save image</a></p>
      <pre id="summary"></pre>
    </div>
  </main>
  <script>
    const MAX_IMAGES = 14;
    const slotsRoot = document.querySelector("#slots");
    const countNode = document.querySelector("#count");
    const statusNode = document.querySelector("#status");
    const generateButton = document.querySelector("#generate");
    const resultNode = document.querySelector("#result");
    const portrait = document.querySelector("#portrait");
    const downloadLink = document.querySelector("#download");
    const summaryNode = document.querySelector("#summary");
    const chosen = new Map();
    let slots = [];

    function setStatus(text) {
      statusNode.textContent = text;
    }

    function totalPhotos() {
      let total = 0;
      for (const files of chosen.values()) total += files.length;
      return total;
    }

    function updateCount() {
      countNode.textContent = `${totalPhotos()} of ${MAX_IMAGES} photos`;
    }

    function renderPreviews(slot) {
      const box = document.querySelector(`[data-previews="${slot.key}"]`);
      for (const image of box.querySelectorAll("img")) URL.revokeObjectURL(image.src);
      box.replaceChildren();
      for (const file of chosen.get(slot.key) || []) {
        const figure = document.createElement("figure");
        const image = document.createElement("img");
        image.src = URL.createObjectURL(file);
        image.alt = "";
        const caption = document.createElement("figcaption");
        caption.append(file.name);
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "Remove";
        remove.addEventListener("click", () => {
          URL.revokeObjectURL(image.src);
          const files = chosen.get(slot.key).filter((item) => item !== file);
          chosen.set(slot.key, files);
          renderPreviews(slot);
          updateCount();
        });
        caption.append(remove);
        figure.append(image, caption);
        box.append(figure);
      }
    }

    function takeFiles(slot, fileList) {
      const skip = document.querySelector(`[data-skip="${slot.key}"]`);
      if (skip && skip.checked) return;
      const existing = chosen.get(slot.key) || [];
      const others = totalPhotos() - existing.length;
      const capacity = MAX_IMAGES - others;
      const allowed = slot.many ? Math.max(0, capacity - existing.length) : Math.max(0, capacity);
      if (allowed <= 0) {
        setStatus(`The limit is ${MAX_IMAGES} photos. Remove one to add another.`);
        return;
      }
      let next = Array.from(fileList);
      if (!slot.many) next = next.slice(0, 1);
      if (next.length > allowed) {
        next = next.slice(0, allowed);
        setStatus(`Only ${allowed} more photo${allowed === 1 ? "" : "s"} fit in the limit.`);
      } else {
        setStatus("");
      }
      chosen.set(slot.key, slot.many ? existing.concat(next) : next);
      renderPreviews(slot);
      updateCount();
    }

    function renderSlot(slot) {
      const section = document.createElement("section");
      const title = document.createElement("h2");
      title.textContent = slot.ask;
      const hint = document.createElement("p");
      hint.className = "hint";
      hint.textContent = slot.many
        ? "None or many. Add a close-up for each detail you need to keep sharp."
        : "One photo. Skip this only when the outfit has no separate picture of this piece.";
      const row = document.createElement("div");
      row.className = "row";
      const choose = document.createElement("label");
      choose.className = "choose";
      choose.textContent = slot.many ? "Add photos" : "Choose photo";
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "image/jpeg,image/png,image/webp,image/gif";
      if (slot.many) input.multiple = true;
      input.addEventListener("change", () => {
        takeFiles(slot, input.files);
        input.value = "";
      });
      choose.append(input);
      row.append(choose);
      if (slot.required && !slot.many) {
        const skipLabel = document.createElement("label");
        skipLabel.className = "skip";
        const skip = document.createElement("input");
        skip.type = "checkbox";
        skip.dataset.skip = slot.key;
        skip.addEventListener("change", () => {
          input.disabled = skip.checked;
          choose.style.opacity = skip.checked ? "0.4" : "1";
          if (skip.checked) {
            chosen.set(slot.key, []);
            renderPreviews(slot);
            updateCount();
          }
        });
        skipLabel.append(skip, "Skip this piece");
        row.append(skipLabel);
      }
      const previews = document.createElement("div");
      previews.className = "previews";
      previews.dataset.previews = slot.key;
      section.append(title, hint, row, previews);
      slotsRoot.append(section);
      chosen.set(slot.key, []);
    }

    function missingRequired() {
      return slots.filter((slot) => {
        if (!slot.required || slot.many) return false;
        const skip = document.querySelector(`[data-skip="${slot.key}"]`);
        if (skip && skip.checked) return false;
        return (chosen.get(slot.key) || []).length === 0;
      });
    }

    async function uploadAll(session) {
      const files = [];
      for (const slot of slots) {
        for (const file of chosen.get(slot.key) || []) files.push({ slot, file });
      }
      for (let index = 0; index < files.length; index += 1) {
        const { slot, file } = files[index];
        setStatus(`Uploading ${index + 1} of ${files.length}…`);
        const response = await fetch("/api/upload", {
          method: "POST",
          headers: {
            "X-Session": session,
            "X-Slot": slot.key,
            "X-Filename": encodeURIComponent(file.name),
          },
          body: file,
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || "Upload failed.");
      }
    }

    generateButton.addEventListener("click", async () => {
      const missing = missingRequired();
      if (missing.length) {
        setStatus(`Add a photo for “${missing[0].ask}”, or skip that piece.`);
        return;
      }
      if (totalPhotos() === 0) {
        setStatus("Add at least one photo.");
        return;
      }
      generateButton.disabled = true;
      resultNode.hidden = true;
      const session = crypto.randomUUID();
      try {
        await uploadAll(session);
        setStatus("Generating the portrait. A 4K image can take several minutes.");
        const response = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session }),
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || "Generation failed.");
        portrait.src = payload.image;
        downloadLink.href = payload.image;
        summaryNode.textContent = payload.summary || "";
        resultNode.hidden = false;
        setStatus("Done.");
        resultNode.scrollIntoView({ behavior: "smooth", block: "start" });
      } catch (error) {
        setStatus(error.message || "Something went wrong.");
      } finally {
        generateButton.disabled = false;
      }
    });

    fetch("/api/slots")
      .then((response) => response.json())
      .then((payload) => {
        slots = payload;
        for (const slot of slots) renderSlot(slot);
      })
      .catch(() => {
        setStatus("The page could not load the garment list. Start it with python serve_dress.py.");
      });
  </script>
</body>
</html>
